spring.application.name=domino

# ---------- Banco de dados (H2 em arquivo: partidas e ranking continuam salvos ao reiniciar) ----------
spring.datasource.url=jdbc:h2:file:./data/domino
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Spring AI + Google Gemini ----------
# A chave NUNCA fica neste arquivo: ela vem da  de ambiente GEMINI_API_KEY.
# Sem a variável, o sistema sobe normalmente e a IA joga em modo automático.
#spring.ai.google.genai.api-key=${GEMINI_API_KEY:CHAVE_NAO_CONFIGURADA}

# O nome da propriedade do modelo muda conforme a versão do Spring AI.
# As duas linhas abaixo são equivalentes (a que não for reconhecida é ignorada).
#spring.ai.google.genai.chat.options.model=gemini-3.8-flash
#spring.ai.google.genai.chat.model=gemini-3.8-flash

# CONFIGURA��O COM O GROQ
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1

# Modelo de IA
spring.ai.openai.chat.model=openai/gpt-oss-20b

# Configura��es de resposta
spring.ai.openai.chat.temperature=0.2
spring.ai.openai.chat.max-completion-tokens=4096


# N�o reenviar conte�do de racioc�nio em requisi��es posteriores
spring.ai.openai.chat.replay-reasoning-content=false
